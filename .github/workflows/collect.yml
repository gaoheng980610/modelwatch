name: collect

# Daily data refresh, and a publish on every change:
#   collect -> test -> validate -> audit -> build -> check links -> check claims
#   -> commit the data snapshot -> deploy the site to GitHub Pages
#
# Starts running the moment this repo exists. No other setup needed.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily (off the :00 mark on purpose)
  # Run on every push too, so a change can never land without being collected,
  # validated, audited, built and link-checked. A commit made with the default
  # GITHUB_TOKEN does not re-trigger workflows, so this cannot loop.
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The site is served from a sub-path on a project page, so every internal link
  # needs this prefix. It drives canonical URLs, og tags, the sitemap and the
  # in-page JS. Change it (and that is all) to move to a custom domain.
  MODELWATCH_BASE_URL: https://gaoheng980610.github.io/modelwatch
  # To serve on a custom domain instead, set the repo variable MODELWATCH_CNAME
  # (Settings -> Secrets and variables -> Actions -> Variables) to e.g.
  # "modelwatch.dev". It wins over MODELWATCH_BASE_URL and also emits the CNAME
  # file Pages needs — no commit required. Remember to set the same domain under
  # Settings -> Pages and to point DNS at GitHub.
  MODELWATCH_CNAME: ${{ vars.MODELWATCH_CNAME }}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect
        env:
          # Optional. When this secret is set, the first-party Anthropic Models
          # API adapter starts contributing verified live data. Absent = skipped.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/collector.py

      - name: Validate
        run: python src/validate.py

      - name: Audit
        run: python src/audit.py

      - name: Build site
        run: python src/build_site.py

      - name: Check internal links
        run: python src/check_links.py

      - name: Check rendered figures
        run: python src/check_claims.py

      - name: Commit data snapshot
        run: |
          git config user.name  "modelwatch-bot"
          git config user.email "modelwatch-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no data changes" || \
            git commit -m "chore(data): snapshot $(date -u +%F)"
          git push

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishing lives in its own job on purpose: a Pages misconfiguration must
  # never be able to fail the collection job above, which is the part that
  # matters. Note that a token CANNOT create a Pages site — that is a one-time
  # repo setting (Settings -> Pages -> Source: GitHub Actions).
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

